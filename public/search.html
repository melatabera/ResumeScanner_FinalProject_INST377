<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="search.css"/>
    <script src="index.js" defer></script>
    <title>Search Page</title>
</head>
<body>
     <nav>
        <h2>SkillsMatch</h2>
        <h4><a href="index.html">Home</a></h4>
        <h4><a href="resume.html">Upload a Resume</a></h4>
        <h4><a href="search.html">Find a Job</a></h4>
        <h4><a href="about.html">Support</a></h4>
    </nav>
    <div id="search">
        <div id="intro">
            <h2>Find Internships</h2>
            <p>Once you find your desired jobs, paste the job description to the resume scanner
            to get your match score!
        </div>
        
        </p>

        <div id="search_row">
            <div id="search_box">
                <input  id="query" type="text" placeholder="Search by job title or company">
            </div>
             <button id="search_btn">Search</button>
        </div>
    </div>

    <div id="main-content">
    <div id="job_search">
        <div class="card">
            <div class="card_header">
                <div class="logo">G</div>
            </div>
            <div class="content">
                <h3 class="job_name"></h3>
                <div id="info">
                    <h6 class="company_name"></h6>
                    <h6 id="location"></h6>
                    <h6 class="type"></h6>
            </div>
        </div>

</body>
</html>
